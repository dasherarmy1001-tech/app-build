name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download & Extract Project Zip
        run: |
          mkdir -p build_workspace
          cd build_workspace
          ZIP_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/v1 | grep "browser_download_url.*zip" | cut -d '"' -f 4 | head -n 1)
          curl -L -o project.zip "$ZIP_URL"
          unzip -q project.zip -d unzipped/
          GRADLE_PATH=$(find unzipped/ -name "build.gradle*" | head -n 1)
          ROOT_DIR=$(dirname "$GRADLE_PATH")
          cp -r "$ROOT_DIR"/* . 2>/dev/null || true
          cp -r "$ROOT_DIR"/.* . 2>/dev/null || true
          rm -rf unzipped project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        working-directory: build_workspace
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        working-directory: build_workspace
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATH-APP-APK
          path: build_workspace/app/build/outputs/apk/debug/*.apk
          
